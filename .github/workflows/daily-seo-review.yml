name: Daily SEO review

on:
  schedule:
    - cron: "0 5 * * *"   # every day 05:00 UTC = 09:00 in Yerevan
  workflow_dispatch:       # "Run workflow" button for a run on demand

permissions:
  contents: write          # to save each day's data and report back to the repository

concurrency:
  group: daily-seo-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, analyze, review and send
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.run

      - name: Save today's data and report
        if: always()
        run: |
          git config user.name "seo-review-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "SEO review $(date -u +%F)" || echo "Nothing new to save"
          git push
